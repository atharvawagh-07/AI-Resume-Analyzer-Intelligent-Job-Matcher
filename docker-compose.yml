version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resume_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: resume_matcher_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume_fastapi
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/resume_matcher_db
    depends_on:
      postgres:
        condition: service_healthy

  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume_web_app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - fastapi-backend

volumes:
  pgdata:
